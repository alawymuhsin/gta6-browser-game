<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solara Bay — Street Heat: an original open-world crime game in the browser. Ten story missions, street races, a police helicopter, and a wanted level that answers back.">
<title>Solara Bay — Street Heat</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Kept off-screen on purpose: the status line is only for screen readers. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solara Bay Street Heat: an open-world crime game. Walk the city, steal cars, run ten jobs for Maya Solis, race the checkpoints, and outrun the police helicopter."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
